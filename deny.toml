[graph]
# cargo-deny is really only ever intended to run on the "normal" tier-1 targets
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
version = 2
ignore = [
    # Transitive through `starlark` in the current Codex tag. No safe local
    # upgrade is available from this SDK without moving the Codex dependency.
    "RUSTSEC-2024-0388",
    "RUSTSEC-2024-0436",

    # Transitive through `bm25`/`starlark_map` in the current Codex tag. No safe
    # local upgrade is available from this SDK.
    "RUSTSEC-2025-0057",

    # Transitive through Codex's `rama-dns`/`hickory-resolver` stack. Hickory
    # 0.26.x is semver-incompatible with the pinned Rama prerelease.
    "RUSTSEC-2026-0118",
    "RUSTSEC-2026-0119",

    # Unmaintained dependencies selected by the current Codex tag through
    # serde_yaml, zbus 4, i18n-config, and Codex's chrono APIs.
    "RUSTSEC-2024-0449",
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
    "RUSTSEC-2026-0374",
    "RUSTSEC-2026-0543",

    # The pinned Rama resolver performs DNS lookups and does not parse zone files.
    "RUSTSEC-2026-0487",
    "RUSTSEC-2026-0489",
    "RUSTSEC-2026-0490",

    # Neither hickory-proto nor hickory-resolver enables DNSSEC in this graph.
    "RUSTSEC-2026-0504",
    "RUSTSEC-2026-0505",
    "RUSTSEC-2026-0511",
    "RUSTSEC-2026-0512",
    "RUSTSEC-2026-0514",
    "RUSTSEC-2026-0530",
    "RUSTSEC-2026-0531",
    "RUSTSEC-2026-0532",
    "RUSTSEC-2026-0549",
    "RUSTSEC-2026-0550",
    "RUSTSEC-2026-0551",

    # Timing and DNS allocation risks remain in the pinned dependency chains.
    # Remove each exception once Cargo.lock selects crypto-bigint >=0.7.6 or
    # hickory-proto >=0.26.2 for its affected dependency chain.
    { id = "RUSTSEC-2026-0387", reason = "Temporary exception for the crypto-bigint 0.5 dependency of elliptic-curve 0.13 in the pinned Codex release" },
    { id = "RUSTSEC-2026-0491", reason = "Temporary exception for Hickory 0.25 used by the pinned Rama resolver" },
]

[bans]
multiple-versions = "allow"
wildcards = 'allow'
deny = [
    { crate = "git2", use-instead = "gix" },
    { crate = "openssl", use-instead = "rustls", wrappers = ["native-tls"], reason = "accepted only through Codex's native-tls stack" },
    { crate = "openssl-sys", use-instead = "rustls", wrappers = ["openssl", "native-tls", "codex-core", "curl", "curl-sys"], reason = "accepted only through Codex's native-tls and libcurl paths" },
    "libssh2-sys",
    { crate = "cmake", use-instead = "cc", wrappers = ["aws-lc-sys"], reason = "accepted only as an aws-lc-sys build dependency from Codex/Rama TLS support" },
    { crate = "windows", reason = "accepted only through current Codex Windows/process wrappers", use-instead = "ideally inline bindings, practically, windows-sys", wrappers = ["codex-windows-sandbox", "mxc-sdk", "process-wrap"] },
]
skip = [
    { crate = "bitflags@1.3.2", reason = "https://github.com/seanmonstar/reqwest/pull/2130 should be in the next version" },
]

[bans.workspace-dependencies]
duplicates = 'deny'
include-path-dependencies = true
unused = 'deny'

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/openai/codex",
    "https://github.com/helix-editor/nucleo.git",
    "https://github.com/openai-oss-forks/tokio-tungstenite",
    "https://github.com/openai-oss-forks/tungstenite-rs",
    "https://github.com/microsoft/mxc",
    "https://github.com/modelcontextprotocol/rust-sdk",
    "https://github.com/transact-rs/sqlx",
]

[licenses]
# We want really high confidence when inferring licenses from text
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MPL-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
exceptions = [
    # Use exceptions for these as they only have a single user
    { allow = ["Zlib"], crate = "tinyvec" },
]

# Sigh
[[licenses.clarify]]
crate = "ring"
# SPDX considers OpenSSL to encompass both the OpenSSL and SSLeay licenses
# https://spdx.org/licenses/OpenSSL.html
# ISC - Both BoringSSL and ring use this for their new files
# MIT - "Files in third_party/ have their own licenses, as described therein. The MIT
# license, for third_party/fiat, which, unlike other third_party directories, is
# compiled into non-test libraries, is included below."
# OpenSSL - Obviously
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
crate = "webpki"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

# Actually "ISC-style"
[[licenses.clarify]]
crate = "rustls-webpki"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]
